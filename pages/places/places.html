<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helyek - Project Hub</title>
<link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../pages.css"><link rel="stylesheet" href="places.css">
<style>body{visibility:hidden}body.authenticated{visibility:visible}</style>
</head>
<body>
<header class="places-topbar"><div class="places-topbar-inner">
<a href="../../index.html" class="places-back" aria-label="Vissza a főoldalra"><i class="fi fi-br-arrow-left" aria-hidden="true"></i></a><div><p class="eyebrow">PROJECT HUB</p><h1>Helyek</h1></div><a href="../profile/profile.html" class="page-profile-link">Profil</a>
</div></header>
<main class="places-page">
<section class="places-hero"><p class="eyebrow">SAJÁT HELYEID</p><h2><i class="fi fi-br-marker" aria-hidden="true"></i> Mentsd el a fontos helyeket.</h2><p>Kedvencek, kategóriák, címek és jegyzetek egy helyen.</p></section>
<section class="places-card">
<div class="places-toolbar"><label class="places-search"><span><i class="fi fi-br-search" aria-hidden="true"></i></span><input id="placesSearch" type="search" placeholder="Hely keresése..." autocomplete="off"></label><button id="addPlaceButton" class="primary-action" type="button">+ Hely hozzáadása</button></div>
<div class="places-filters" role="group" aria-label="Helyek szűrése"><button class="place-filter active" data-filter="all">Összes</button><button class="place-filter" data-filter="favorite"><i class="fi fi-br-star" aria-hidden="true"></i> Kedvencek</button><button class="place-filter" data-filter="city"><i class="fi fi-br-city" aria-hidden="true"></i> Város</button><button class="place-filter" data-filter="food"><i class="fi fi-br-utensils" aria-hidden="true"></i> Étterem</button><button class="place-filter" data-filter="other"><i class="fi fi-br-thumbtack" aria-hidden="true"></i> Egyéb</button></div>
<div id="placesMeta" class="places-meta">Betöltés...</div><div id="placesList" class="places-list"><div class="places-state"><i class="fi fi-br-spinner" aria-hidden="true"></i><strong>Helyek betöltése...</strong></div></div>
</section></main>
<div id="placeModal" class="place-modal" hidden><div class="place-overlay"></div><div class="place-dialog" role="dialog" aria-modal="true" aria-labelledby="placeModalTitle"><button id="closePlaceButton" class="place-close" type="button" aria-label="Bezárás"><i class="fi fi-br-cross" aria-hidden="true"></i></button><p class="eyebrow">HELY</p><h2 id="placeModalTitle">Hely hozzáadása</h2><form id="placeForm" class="place-form"><input id="placeId" type="hidden"><label>Hely neve<input id="placeName" maxlength="160" required placeholder="Pl. kedvenc kávézó"></label><label>Kategória<select id="placeCategory"><option>Egyéb</option><option>Város</option><option>Étterem</option><option>Kávézó</option><option>Munka</option><option>Utazás</option><option>Szórakozás</option></select></label><label>Cím<input id="placeAddress" maxlength="300" placeholder="Cím vagy Google Maps link"></label><label>Megjegyzés<textarea id="placeNotes" maxlength="1200" rows="5" placeholder="Miért fontos ez a hely?"></textarea></label><label class="place-check"><input id="placeFavorite" type="checkbox"> <i class="fi fi-br-star" aria-hidden="true"></i> Kedvenc hely</label><div class="place-actions"><button id="cancelPlaceButton" type="button" class="secondary-action">Mégse</button><button type="submit" class="primary-action">Mentés</button></div></form></div></div>
<script src="places.js"></script><script src="../../refresh.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Helyek - Project Hub</title>


    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="../pages.css"
    >


    <!-- =========================================
         APP VÉDELEM
    ========================================== -->

    <style>

        body {
            visibility: hidden;
        }

        body.authenticated {
            visibility: visible;
        }

    </style>

    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../../icons/icon-192.png">
    <meta name="theme-color" content="#0b0d12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Project Hub">
    <link rel="stylesheet" href="../../pwa.css">

</head>


<body>


    <!-- =========================================
         FEJLÉC
    ========================================== -->

    <header class="header">

        <div>

            <h1>HELYEK</h1>

            <p>
                Project Hub
            </p>

        </div>


        <a
            href="../../index.html"
            class="back-button"
            aria-label="Vissza"
        >

            <span class="back-arrow"></span>

        </a>

    </header>



    <!-- =========================================
         FŐ TARTALOM
    ========================================== -->

    <main class="page-content places-page">


        <section class="welcome">

            <p class="small-title">
                PROJECT HUB
            </p>

            <h2>
                📍 Helyek
            </h2>

            <p>
                Ide kerülnek majd az érdekes helyeid.
            </p>

        </section>


    </main>



    <!-- =========================================
         AUTH ELLENŐRZÉS
    ========================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                const BACKEND_URL =
                    "https://project-hub-backend-1.onrender.com";


                const LOGIN_PAGE =
                    "../auth/login.html";


                // =====================================
                // TOKEN
                // =====================================

                const token =
                    localStorage.getItem(
                        "projectHubAuthToken"
                    );


                // =====================================
                // NINCS TOKEN
                // =====================================

                if (!token) {

                    sessionStorage.setItem(
                        "projectHubAuthMessage",
                        "🔐 A Helyek használatához be kell jelentkezned."
                    );

                    window.location.href =
                        LOGIN_PAGE;

                    return;

                }


                // =====================================
                // AUTH ELLENŐRZÉS
                // =====================================

                try {

                    const response =
                        await fetch(
                            BACKEND_URL +
                            "/api/auth/me",
                            {
                                method: "GET",

                                headers: {
                                    "Authorization":
                                        "Bearer " + token
                                },

                                credentials:
                                    "include"
                            }
                        );


                    let result;


                    try {

                        result =
                            await response.json();

                    } catch (jsonError) {

                        console.error(
                            "Auth válasz feldolgozási hiba:",
                            jsonError
                        );


                        localStorage.removeItem(
                            "projectHubAuthToken"
                        );


                        sessionStorage.setItem(
                            "projectHubAuthMessage",
                            "⚠️ A munkamenetet nem sikerült ellenőrizni. Jelentkezz be újra."
                        );


                        window.location.href =
                            LOGIN_PAGE;

                        return;

                    }


                    console.log(
                        "HELYEK AUTH ELLENŐRZÉS:",
                        result
                    );


                    // =================================
                    // SIKERES AUTH
                    // =================================

                    if (
                        response.ok &&
                        result.success &&
                        result.user
                    ) {

                        console.log(
                            "Helyek oldal engedélyezve:",
                            result.user.username
                        );


                        document.body.classList.add(
                            "authenticated"
                        );


                        return;

                    }


                    // =================================
                    // ÉRVÉNYTELEN TOKEN
                    // =================================

                    localStorage.removeItem(
                        "projectHubAuthToken"
                    );


                    sessionStorage.setItem(
                        "projectHubAuthMessage",
                        "🔐 A munkameneted lejárt. Kérlek jelentkezz be újra."
                    );


                    window.location.href =
                        LOGIN_PAGE;


                } catch (error) {

                    console.error(
                        "Helyek auth ellenőrzési hiba:",
                        error
                    );


                    localStorage.removeItem(
                        "projectHubAuthToken"
                    );


                    sessionStorage.setItem(
                        "projectHubAuthMessage",
                        "⚠️ A munkamenetet nem sikerült ellenőrizni. Jelentkezz be újra."
                    );


                    window.location.href =
                        LOGIN_PAGE;

                }

            }
        );

    </script>


    <!-- =========================================
         PROJECT HUB SCRIPT
    ========================================== -->

    <script src="../../script.js"></script>



    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("../../sw.js", { scope: "../../" }).catch((error) => {
                    console.warn("Project Hub PWA service worker hiba:", error);
                });
            });
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jegyzetek - Project Hub</title>

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="../pages.css"
    >

    <link
        rel="stylesheet"
        href="notes.css"
    >


    <!-- =========================================
         APP VÉDELEM
    ========================================== -->

    <style>

        body {
            visibility: hidden;
        }

        body.authenticated {
            visibility: visible;
        }

    </style>

    <script src="../../debug.js"></script>

</head>


<body>


    <!-- =========================================
         FEJLÉC
    ========================================== -->

    <header class="header">

        <a href="../../index.html" class="back-button" aria-label="Vissza a főoldalra">
            <span class="back-arrow"></span>
        </a>

        <div>

            <h1>JEGYZETEK</h1>

            <p>
                Project Hub
            </p>

        </div>


        <a href="../profile/profile.html" class="page-profile-link">Profil</a>

    </header>



    <!-- =========================================
         FŐ TARTALOM
    ========================================== -->

    <main class="page-content notes-page">


        <!-- =====================================
             BEVEZETŐ
        ====================================== -->

        <section class="page-intro">

            <p class="small-title">
                PROJECT HUB
            </p>

            <h2>
                <i class="fi fi-br-note-sticky" aria-hidden="true"></i> Jegyzeteim
            </h2>

            <p>
                Mentsd el az ötleteidet és fontos gondolataidat.
            </p>

        </section>



        <!-- =====================================
             MODUL GOMBOK
        ====================================== -->

        <div class="module-actions">

            <button
                id="toggleNoteEditor"
                class="module-toggle-button"
                type="button"
            >
                ➕ Új jegyzet
            </button>

            <button
                id="toggleNoteFilters"
                class="module-toggle-button"
                type="button"
            >
                🔎 Keresés és szűrés
            </button>

        </div>



        <!-- =====================================
             ÚJ JEGYZET
        ===================================== -->

        <section
            class="notes-editor collapsible-panel"
            id="noteEditor"
        >

            <input
                type="text"
                id="noteTitle"
                placeholder="Jegyzet címe..."
                maxlength="100"
            >


            <select id="noteCategory">

                <option value="Egyéb">
                    <i class="fi fi-br-folder" aria-hidden="true"></i> Egyéb
                </option>

                <option value="Ötlet">
                    <i class="fi fi-br-lightbulb" aria-hidden="true"></i> Ötlet
                </option>

                <option value="Munka">
                    <i class="fi fi-br-briefcase" aria-hidden="true"></i> Munka
                </option>

                <option value="Személyes">
                    <i class="fi fi-br-user" aria-hidden="true"></i> Személyes
                </option>

                <option value="Fontos">
                    <i class="fi fi-br-star" aria-hidden="true"></i> Fontos
                </option>

                <option value="Projekt">
                    <i class="fi fi-br-rocket" aria-hidden="true"></i> Projekt
                </option>

            </select>


            <textarea
                id="noteText"
                placeholder="Írd ide a jegyzeted..."
                rows="7"
            ></textarea>


            <button
                id="saveNote"
                class="save-note-button"
                type="button"
            >

                💾 Jegyzet mentése

            </button>

        </section>



        <!-- =====================================
             KERESÉS + SZŰRÉS
        ===================================== -->

        <section
            class="notes-tools collapsible-panel"
            id="noteFilters"
        >

            <div class="notes-search">

                <span class="search-icon">
                    <i class="fi fi-br-search" aria-hidden="true"></i>
                </span>

                <input
                    type="search"
                    id="noteSearch"
                    placeholder="Keresés a jegyzetek között..."
                    autocomplete="off"
                >

            </div>


            <div class="notes-filters">

                <select id="categoryFilter">

                    <option value="all">
                        <i class="fi fi-br-folder" aria-hidden="true"></i> Minden kategória
                    </option>

                    <option value="Ötlet">
                        <i class="fi fi-br-lightbulb" aria-hidden="true"></i> Ötlet
                    </option>

                    <option value="Munka">
                        <i class="fi fi-br-briefcase" aria-hidden="true"></i> Munka
                    </option>

                    <option value="Személyes">
                        <i class="fi fi-br-user" aria-hidden="true"></i> Személyes
                    </option>

                    <option value="Fontos">
                        <i class="fi fi-br-star" aria-hidden="true"></i> Fontos
                    </option>

                    <option value="Projekt">
                        <i class="fi fi-br-rocket" aria-hidden="true"></i> Projekt
                    </option>

                    <option value="Egyéb">
                        <i class="fi fi-br-folder" aria-hidden="true"></i> Egyéb
                    </option>

                </select>


                <select id="sortNotes">

                    <option value="newest">
                        🕐 Legújabb
                    </option>

                    <option value="oldest">
                        🕐 Legrégebbi
                    </option>

                    <option value="az">
                        <i class="fi fi-br-sort-alpha-down" aria-hidden="true"></i> A <i class="fi fi-br-arrow-right" aria-hidden="true"></i> Z
                    </option>

                    <option value="za">
                        <i class="fi fi-br-sort-alpha-down" aria-hidden="true"></i> Z <i class="fi fi-br-arrow-right" aria-hidden="true"></i> A
                    </option>

                </select>

            </div>

        </section>



        <!-- =====================================
             MENTETT JEGYZETEK
        ===================================== -->

        <section class="notes-section">


            <div class="section-header">

                <h2>
                    📋 Mentett jegyzetek
                </h2>

                <span id="noteTotal">
                    0 db
                </span>

            </div>



            <div
                id="notesList"
                class="notes-list"
            ></div>



            <div
                id="emptyNotes"
                class="empty-notes"
            >

                <div class="empty-icon">
                    <i class="fi fi-br-note-sticky" aria-hidden="true"></i>
                </div>

                <h3>
                    Még nincs jegyzeted
                </h3>

                <p>
                    Írj egyet fent és mentsd el.
                </p>

            </div>



            <div
                id="noSearchResults"
                class="empty-notes no-search-results"
            >

                <div class="empty-icon">
                    <i class="fi fi-br-search" aria-hidden="true"></i>
                </div>

                <h3>
                    Nincs találat
                </h3>

                <p>
                    Próbálj más keresést vagy szűrőt.
                </p>

            </div>


        </section>

    </main>



    <!-- =========================================
         TELJES JEGYZET MODAL
    ========================================== -->

    <div
        id="noteModal"
        class="note-modal"
    >

        <div class="note-modal-overlay"></div>


        <div
            class="note-modal-card"
            role="dialog"
            aria-modal="true"
        >

            <div class="note-modal-header">

                <div class="modal-note-heading">

                    <span
                        id="modalNoteCategory"
                        class="modal-note-category"
                    >
                        <i class="fi fi-br-folder" aria-hidden="true"></i> Egyéb
                    </span>

                    <h2 id="modalNoteTitle">
                        Jegyzet
                    </h2>

                </div>


                <button
                    id="closeNoteModal"
                    class="close-note-modal"
                    type="button"
                    aria-label="Bezárás"
                >

                    <i class="fi fi-br-cross" aria-hidden="true"></i>

                </button>

            </div>



            <div
                id="modalNoteText"
                class="note-modal-text"
            ></div>



            <div
                id="modalNoteDate"
                class="note-modal-date"
            ></div>

        </div>

    </div>



    <!-- =========================================
         AUTH ELLENŐRZÉS
    ========================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                const BACKEND_URL =
                    "https://project-hub-backend-1.onrender.com";


                const LOGIN_PAGE =
                    "../auth/login.html";


                // =====================================
                // TOKEN
                // =====================================

                const token =
                    localStorage.getItem(
                        "projectHubAuthToken"
                    );


                // =====================================
                // NINCS TOKEN
                // =====================================

                if (!token) {

                    sessionStorage.setItem(
                        "projectHubAuthMessage",
                        '<i class="fi fi-br-lock" aria-hidden="true"></i> A Jegyzetek használatához be kell jelentkezned.'
                    );

                    window.location.href =
                        LOGIN_PAGE;

                    return;

                }


                // =====================================
                // AUTH ELLENŐRZÉS
                // =====================================

                try {

                    const response =
                        await fetch(
                            BACKEND_URL +
                            "/api/auth/me",
                            {
                                method: "GET",

                                headers: {
                                    "Authorization":
                                        "Bearer " + token
                                },

                                credentials:
                                    "include"
                            }
                        );


                    let result;


                    try {

                        result =
                            await response.json();

                    } catch (jsonError) {

                        console.error(
                            "Auth válasz feldolgozási hiba:",
                            jsonError
                        );

                        localStorage.removeItem(
                            "projectHubAuthToken"
                        );

                        sessionStorage.setItem(
                            "projectHubAuthMessage",
                            "⚠️ A munkamenetet nem sikerült ellenőrizni. Jelentkezz be újra."
                        );

                        window.location.href =
                            LOGIN_PAGE;

                        return;

                    }


                    console.log(
                        "JEGYZETEK AUTH ELLENŐRZÉS:",
                        result
                    );


                    // =================================
                    // SIKERES AUTH
                    // =================================

                    if (
                        response.ok &&
                        result.success &&
                        result.user
                    ) {

                        console.log(
                            "Jegyzetek oldal engedélyezve:",
                            result.user.username
                        );


                        document.body.classList.add(
                            "authenticated"
                        );


                        return;

                    }


                    // =================================
                    // ÉRVÉNYTELEN TOKEN
                    // =================================

                    localStorage.removeItem(
                        "projectHubAuthToken"
                    );


                    sessionStorage.setItem(
                        "projectHubAuthMessage",
                        '<i class="fi fi-br-lock" aria-hidden="true"></i> A munkameneted lejárt. Kérlek jelentkezz be újra.'
                    );


                    window.location.href =
                        LOGIN_PAGE;


                } catch (error) {

                    console.error(
                        "Jegyzetek auth ellenőrzési hiba:",
                        error
                    );


                    localStorage.removeItem(
                        "projectHubAuthToken"
                    );


                    sessionStorage.setItem(
                        "projectHubAuthMessage",
                        "⚠️ A munkamenetet nem sikerült ellenőrizni. Jelentkezz be újra."
                    );


                    window.location.href =
                        LOGIN_PAGE;

                }

            }
        );

    </script>



    <!-- =========================================
         PROJECT HUB SCRIPT
    ========================================== -->

    <script src="../../script.js"></script>


    <!-- =========================================
         JEGYZETEK SCRIPT
    ========================================== -->

    <script src="notes.js"></script>


</body>

</html>
